name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build Windows x86 and x64 installers
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -Architecture all
      - name: Test Windows x86 release
        shell: pwsh
        run: ./tests/Test-Release.ps1 -Architecture x86
      - name: Test Windows x64 release
        shell: pwsh
        run: ./tests/Test-Release.ps1 -Architecture x64

  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build and test portable parser
        shell: pwsh
        run: ./tests/Test-Portable.ps1
